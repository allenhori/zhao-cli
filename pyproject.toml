# Packages the `zhao` binary as a platform wheel on PyPI, so it installs with
# `pip install zhao-cli` / `uv tool install zhao-cli` -- the same approach ruff
# and uv use. There's no Python code: maturin compiles the Rust binary and
# puts it on PATH as a console script. The version comes from Cargo.toml, so
# there's still a single place to bump it. See RELEASING.md.

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "zhao-cli"
dynamic = ["version"]
description = "Deterministic, offline change-review and CI gate for data transformation projects."
readme = "README.md"
license = "Apache-2.0"
keywords = ["dbt", "ci", "data", "lineage", "sql"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Rust",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/allenhori/zhao-cli"
Repository = "https://github.com/allenhori/zhao-cli"
Changelog = "https://github.com/allenhori/zhao-cli/releases"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/zhao-cli/Cargo.toml"
# Marks the binary as pip/uv-managed so `zhao update` defers to them.
features = ["pypi"]
strip = true
