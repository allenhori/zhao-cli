name: Release

# Two release channels, both produced by the same cross-compiled binary
# matrix:
#
#   - Stable: triggered by pushing a `v*` tag (e.g. `v0.1.0`). Creates a
#     permanent, semver-tagged GitHub Release. Never overwritten.
#   - Nightly: triggered on a daily schedule (and manually, via
#     workflow_dispatch) off `master`'s current tip. The `nightly` git tag
#     is force-moved to that commit each run, and the "nightly" GitHub
#     Release (marked as a prerelease) is updated in place -- always the
#     latest buildable `master`, not a permanent artifact.
#
# Until zhao-cli has a track record, "stable" just means "a real tagged
# version," not a claim of production hardening beyond what the existing
# test/clippy/fmt/docs CI gates (ci.yml) already enforce on every commit
# that lands on `master` in the first place.

on:
  push:
    tags: ["v*"]
  schedule:
    # 07:00 UTC daily. A schedule trigger always runs against the
    # workflow file on the default branch, at that branch's current tip
    # -- exactly the "latest master" semantics a nightly channel wants.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p zhao-cli

      # A macOS host can cross-compile straight to the other Mac
      # architecture (both are just LLVM targets Xcode's toolchain
      # already supports) -- no separate ARM runner needed for the Intel
      # build, and vice versa.
      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/zhao dist/zhao
          tar -C dist -czf zhao-${{ matrix.target }}.tar.gz zhao

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/zhao.exe" "dist/zhao.exe"
          Compress-Archive -Path "dist/zhao.exe" -DestinationPath "zhao-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: zhao-${{ matrix.target }}
          path: zhao-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  # Publishes to crates.io on the stable channel only -- never for a
  # nightly build, since crates.io versions are permanent (yankable, but
  # never overwritable or deletable) and a nightly's whole point is being
  # a disposable, possibly-broken snapshot. zhao-core first, since
  # zhao-cli depends on it and crates.io rejects a crate whose
  # dependency isn't published yet. If this version was already
  # published (e.g. a re-run of this workflow on the same tag), `cargo
  # publish` fails loudly rather than silently skipping -- consistent
  # with how the rest of this project prefers a clear error over quiet
  # unexpected behavior.
  publish-crates:
    name: Publish to crates.io
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Publish zhao-core
        run: cargo publish -p zhao-core --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish zhao-cli
        run: cargo publish -p zhao-cli --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      # One `SHA256SUMS` file covering every archive in the release, in the
      # standard `sha256sum` format so `sha256sum -c SHA256SUMS` (or
      # `shasum -a 256 -c` on macOS) verifies a download. Package managers
      # (Homebrew, Scoop) pin these same hashes.
      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum zhao-* > SHA256SUMS

      - name: Determine release channel (stable)
        id: stable
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "name=zhao ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Determine release channel (nightly)
        id: nightly
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          echo "tag=nightly" >> "$GITHUB_OUTPUT"
          echo "name=zhao nightly ($(date -u +%Y-%m-%d))" >> "$GITHUB_OUTPUT"

      - name: Set channel outputs
        id: channel
        run: |
          echo "tag=${{ steps.stable.outputs.tag || steps.nightly.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "name=${{ steps.stable.outputs.name || steps.nightly.outputs.name }}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${{ steps.stable.outcome != 'success' }}" >> "$GITHUB_OUTPUT"

      # The nightly tag is a moving pointer -- force it onto the current
      # commit every run, both locally and on the remote, so the release
      # created below (which attaches to this tag) always reflects
      # `master`'s latest buildable state rather than accumulating old
      # commits under one name.
      - name: Move the nightly tag
        if: steps.channel.outputs.tag == 'nightly'
        run: |
          git tag -f nightly
          git push origin nightly --force

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.channel.outputs.tag }}
          name: ${{ steps.channel.outputs.name }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          generate_release_notes: true
          make_latest: ${{ steps.channel.outputs.prerelease == 'false' }}
          body: ${{ steps.channel.outputs.prerelease == 'true' && 'Automated build from the latest `master` -- not a stable release. May be broken; use a `v*` tag for anything you depend on.' || '' }}
          files: dist/*

  # Keeps the Homebrew tap and Scoop bucket in step with every stable
  # release -- and only stable ones: both package managers version by
  # release, so a moving nightly has no place in them. Renders the
  # formula/manifest from this run's own archives (sha256 computed, never
  # hand-edited) and pushes them to their repos. Runs after `publish` so
  # the archives the formula points at already exist as a release.
  #
  # Needs a `PACKAGES_TOKEN` repo secret: a fine-grained PAT with
  # Contents: read/write on allenhori/homebrew-zhao and
  # allenhori/zhao-scoop (the default GITHUB_TOKEN can't push to other
  # repos).
  update-packages:
    name: Update Homebrew tap and Scoop bucket
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Render formula and manifest
        run: scripts/render-packages.sh "${GITHUB_REF_NAME#v}" dist packages

      - name: Push to the tap and bucket
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$PACKAGES_TOKEN" ]; then
            echo "::error::PACKAGES_TOKEN secret is not set -- see the comment above this job"
            exit 1
          fi
          push() {
            local repo="$1" src="$2" dest="$3"
            git clone --depth 1 "https://x-access-token:${PACKAGES_TOKEN}@github.com/allenhori/${repo}.git" "work/${repo}"
            mkdir -p "work/${repo}/$(dirname "$dest")"
            cp "$src" "work/${repo}/${dest}"
            cd "work/${repo}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$dest"
            if git diff --cached --quiet; then
              echo "${repo}: already up to date"
            else
              git commit -m "zhao ${GITHUB_REF_NAME}"
              git push
            fi
            cd - >/dev/null
          }
          push homebrew-zhao packages/zhao.rb Formula/zhao.rb
          push zhao-scoop packages/zhao.json bucket/zhao.json
