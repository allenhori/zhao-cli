name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # `build.rs` embeds the icon and version metadata into zhao.exe, which
  # only happens on a Windows host -- so nothing else in this workflow
  # exercises it. Build the release binary and check the resources landed.
  windows-build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p zhao-cli
      - name: Check the embedded Windows resources
        shell: pwsh
        run: |
          $info = (Get-Item target/release/zhao.exe).VersionInfo
          if (-not $info.FileDescription) { throw "zhao.exe has no embedded version resource" }
          $info | Format-List FileDescription, ProductVersion

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # missing_docs is a workspace-level deny, so it already fails `test` and
  # `clippy` above on any undocumented public item. This job additionally
  # catches broken intra-doc links and other rustdoc-only issues.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --document-private-items

  # examples/hello-zhao-addon/ is deliberately its own separate Cargo
  # workspace (see its own README's "Why this isn't a workspace member"),
  # so none of the jobs above ever touch it -- checked here instead, with
  # the same gates, so it can't silently rot.
  example-addon:
    name: Example Addon
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/hello-zhao-addon
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/hello-zhao-addon
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
